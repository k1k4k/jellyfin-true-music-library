<!DOCTYPE html>
<html>
<head>
    <title>True Music Library</title>
</head>
<body>
    <div id="TrueMusicLibraryConfigPage" data-role="page" class="page type-interior pluginConfigurationPage" data-require="emby-input,emby-button,emby-checkbox,emby-textarea,emby-select">
        <style>
            #TrueMusicLibraryConfigPage .tml-cards { display: flex; flex-wrap: wrap; gap: .8em; margin: 1em 0; }
            #TrueMusicLibraryConfigPage .tml-card { background: rgba(127,127,127,.12); border-radius: .4em; padding: .7em 1em; min-width: 9em; }
            #TrueMusicLibraryConfigPage .tml-card b { display: block; font-size: 1.6em; }
            #TrueMusicLibraryConfigPage .tml-chips span { display: inline-block; background: rgba(127,127,127,.18); border-radius: 1em; padding: .1em .7em; margin: .15em; font-size: .9em; }
            #TrueMusicLibraryConfigPage .tml-chips span.tml-warn { background: rgba(255,170,0,.35); }
            #TrueMusicLibraryConfigPage .tml-filters button { margin: .2em .3em .2em 0; background: rgba(127,127,127,.22); color: inherit; }
            #TrueMusicLibraryConfigPage .tml-filters button.tml-on { background: #00a4dc; color: #fff; }
            #TrueMusicLibraryConfigPage table.tml-table { width: 100%; border-collapse: collapse; font-size: .92em; }
            #TrueMusicLibraryConfigPage table.tml-table th, #TrueMusicLibraryConfigPage table.tml-table td { text-align: left; padding: .35em .5em; border-bottom: 1px solid rgba(127,127,127,.2); vertical-align: top; }
            #TrueMusicLibraryConfigPage tr.tml-album { cursor: pointer; }
            #TrueMusicLibraryConfigPage tr.tml-album:hover { background: rgba(127,127,127,.1); }
            #TrueMusicLibraryConfigPage tr.tml-tracks td { background: rgba(127,127,127,.06); }
            #TrueMusicLibraryConfigPage .tml-flag { display: inline-block; font-size: .8em; border-radius: .3em; padding: 0 .4em; margin: 0 .2em .2em 0; background: rgba(127,127,127,.25); }
            #TrueMusicLibraryConfigPage .tml-flag-Disagreement, #TrueMusicLibraryConfigPage .tml-flag-NoSource { background: rgba(255,170,0,.45); }
            #TrueMusicLibraryConfigPage .tml-flag-Override { background: rgba(0,164,220,.45); }
            #TrueMusicLibraryConfigPage .tml-same { opacity: .55; }
            #TrueMusicLibraryConfigPage .tml-new { color: #52b54b; }
            #TrueMusicLibraryConfigPage .tml-old { text-decoration: line-through; opacity: .6; }
            #TrueMusicLibraryConfigPage .tml-override { display: flex; flex-wrap: wrap; align-items: center; gap: .5em; margin: .3em 0 .8em; }
            #TrueMusicLibraryConfigPage .tml-override input { flex: 1 1 18em; min-width: 0; padding: .45em .6em; border-radius: .3em; border: 1px solid rgba(127,127,127,.4); background: rgba(127,127,127,.12); color: inherit; font: inherit; }
            #TrueMusicLibraryConfigPage .tml-override button { margin: 0; }
            #TrueMusicLibraryConfigPage textarea { display: block; width: 100%; box-sizing: border-box; padding: .5em .6em; border-radius: .3em; border: 1px solid rgba(127,127,127,.4); background: rgba(127,127,127,.12); color: inherit; font: inherit; resize: vertical; }

        <div data-role="content">

                <div class="verticalSection">
                    <h2 class="sectionTitle">True Music Library</h2>
                    <p data-i18n="intro"></p>
                    <p id="TrueMusicLibraryStatus" class="fieldDescription"></p>
                    <p id="tmlPersistence" class="fieldDescription"></p>
                </div>

                <!-- ============ Analyse ============ -->
                <div class="verticalSection">
                    <h2 class="sectionTitle" data-i18n="analyzeTitle"></h2>
                    <p class="fieldDescription" data-i18n-html="analyzeHelp"></p>
                    <button is="emby-button" type="button" id="btnAnalyze" class="raised button-submit emby-button"><span data-i18n="analyze"></span></button>
                    <p id="tmlAnalysisState" class="fieldDescription"></p>
                </div>

                <!-- ============ Réparer / Restaurer ============ -->
                <div class="verticalSection">
                    <h2 class="sectionTitle" data-i18n="repairTitle"></h2>
                    <p class="fieldDescription" data-i18n-html="repairHelp"></p>
                    <p class="fieldDescription" data-i18n="repairAfter"></p>
                    <button is="emby-button" type="button" id="btnRepair" class="raised button-submit emby-button"><span data-i18n="repair"></span></button>
                    <button is="emby-button" type="button" id="btnRestore" class="raised emby-button"><span data-i18n="restore"></span></button>
                    <div id="tmlLastOperation"></div>
                </div>

                <div class="verticalSection">
                    <div id="tmlReport"></div>
                </div>

                <!-- ============ Réglages ============ -->
                <form id="TrueMusicLibraryConfigForm" class="verticalSection">
                    <h2 class="sectionTitle" data-i18n="settingsTitle"></h2>

                    <div class="selectContainer">
                        <select is="emby-select" id="selCollaboration" data-i18n-label="collabLabel">
                            <option value="Both" data-i18n="collabBoth"></option>
                            <option value="FirstOnly" data-i18n="collabFirst"></option>
                        </select>
                    </div>
                    <div class="selectContainer">
                        <select is="emby-select" id="selCompilation" data-i18n-label="compilationLabel">
                            <option value="FolderArtist" data-i18n="compilationFolder"></option>
                            <option value="VariousArtists" data-i18n="compilationVarious"></option>
                            <option value="None" data-i18n="compilationNone"></option>
                        </select>
                    </div>
                    <div class="selectContainer">
                        <select is="emby-select" id="selDisplayName" data-i18n-label="displayLabel">
                            <option value="MusicBrainz" data-i18n="displayMusicBrainz"></option>
                            <option value="Folder" data-i18n="displayFolder"></option>
                            <option value="Tag" data-i18n="displayTag"></option>
                        </select>
                    </div>
                    <div class="inputContainer">
                        <input is="emby-input" id="txtVariousArtists" type="text" data-i18n-label="variousLabel" />
                    </div>
                    <div class="inputContainer">
                        <label class="textareaLabel" for="txtGuestJoins" data-i18n="joinsLabel"></label>
                        <textarea is="emby-textarea" id="txtGuestJoins" rows="4"></textarea>
                    </div>
                    <div class="inputContainer">
                        <label class="textareaLabel" for="txtWhitelist" data-i18n="whitelistLabel"></label>
                        <textarea is="emby-textarea" id="txtWhitelist" rows="6"></textarea>
                    </div>

                    <div class="checkboxContainer checkboxContainer-withDescription">
                        <label class="emby-checkbox-label">
                            <input id="chkPersistence" type="checkbox" is="emby-checkbox" />
                            <span data-i18n="persistenceLabel"></span>
                        </label>
                        <div class="fieldDescription checkboxFieldDescription" data-i18n="persistenceHelp"></div>
                    </div>

                    <div class="checkboxContainer checkboxContainer-withDescription">
                        <label class="emby-checkbox-label">
                            <input id="chkRewrite" type="checkbox" is="emby-checkbox" />
                            <span data-i18n="rewriteLabel"></span>
                        </label>
                        <div class="fieldDescription checkboxFieldDescription" data-i18n="rewriteHelp"></div>
                    </div>

                    <div class="checkboxContainer checkboxContainer-withDescription">
                        <label class="emby-checkbox-label">
                            <input id="chkHideGuests" type="checkbox" is="emby-checkbox" />
                            <span data-i18n="guestsLabel"></span>
                        </label>
                        <div class="fieldDescription checkboxFieldDescription" data-i18n="guestsHelp"></div>
                    </div>

                    <div class="checkboxContainer checkboxContainer-withDescription">
                        <label class="emby-checkbox-label">
                            <input id="chkHideTab" type="checkbox" is="emby-checkbox" />
                            <span data-i18n="tabLabel"></span>
                        </label>
                        <div class="fieldDescription checkboxFieldDescription" data-i18n="tabHelp"></div>
                    </div>

                    <div>
                        <button is="emby-button" type="submit" class="raised button-submit block emby-button"><span data-i18n="save"></span></button>
                    </div>
                </form>
            </div>

                function translatePage() {
                    page.querySelectorAll('[data-i18n]').forEach(function (e) { e.textContent = t(e.getAttribute('data-i18n')); });

                        var label = e.parentNode && e.parentNode.querySelector('label');
                        if (label && label !== e) { label.textContent = text; }

                    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
                        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];

                function names(list) { return (list || []).map(function (a) { return a.Name || a; }).join(', '); }

                        + (current ? '<button is="emby-button" type="button" class="emby-button" data-override="remove">' + esc(t('overrideRemove')) + '</button>' : '')
                        + '<small class="fieldDescription" data-override-status>' + esc(current ? t('overrideCurrent', current.MainArtists.join(', ')) : t('overrideNone')) + '</small>'
                        + '</div>';
                }

                function renderTracks(a) {
                    var rows = a.Tracks.map(function (x) {
                        var cur = (x.CurrentArtists || []).join(' ; ');
                        var next = (x.Artists || []).join(', ');
                        return '<tr><td>' + esc((x.Disc ? x.Disc + '.' : '') + (x.Number || '')) + '</td><td>' + esc(x.Name) + '</td>'
                            + '<td>' + (!x.Changed ? '<span class="tml-same">' + esc(next) + '</span>' : '<span class="tml-old">' + esc(cur) + '</span><br><span class="tml-new">' + esc(next) + '</span>') + '</td>'
                            + '<td>' + esc(x.CreditSource) + '</td></tr>';
                    }).join('');
                    return renderOverride(a)
                        + '<table class="tml-table"><thead><tr><th>#</th><th>' + esc(t('colTrack')) + '</th><th>' + esc(t('colTrackArtists')) + '</th><th>' + esc(t('colCredit')) + '</th></tr></thead><tbody>' + rows + '</tbody></table>';
                }

                function chip(r, text) {
                    var title = (r.Favorites ? t('favorite') + ' ' : '') + (r.Played ? t('played') : '');
                    return '<span class="' + (r.Favorites || r.Played ? 'tml-warn' : '') + '" title="' + esc(title) + '">' + esc(text) + '</span>';
                }

                function renderLibrary(lib, index) {
                    var s = lib.Summary;
                    var hidden = s.Removed.filter(function (r) { return r.Fate === 'Hidden'; });
                    var merged = s.Removed.filter(function (r) { return r.Fate === 'Merged'; });
                    var deleted = s.Removed.filter(function (r) { return r.Fate === 'Deleted'; });
                    var html = '<h3>' + esc(lib.Name) + '</h3>'
                        + '<div class="tml-cards">'
                        + '<div class="tml-card"><b>' + s.CurrentArtistsTab + ' → ' + s.ProposedArtists.length + '</b>' + esc(t('cardArtists')) + '</div>'
                        + '<div class="tml-card"><b>' + s.CurrentAlbumArtistsTab + '</b>' + esc(t('cardAlbumArtists')) + '</div>'
                        + '<div class="tml-card"><b>' + s.ChangedAlbums + ' / ' + s.Albums + '</b>' + esc(t('cardAlbums')) + '</div>'
                        + '<div class="tml-card"><b>' + s.ChangedTracks + ' / ' + s.Tracks + '</b>' + esc(t('cardTracks')) + '</div>'
                        + '<div class="tml-card"><b>' + (s.ByFlag.Disagreement || 0) + '</b>' + esc(t('cardDisagreements')) + '</div>'
                        + '</div>'
                        + '<p class="fieldDescription">' + esc(t('fetchers', s.Fetchers.join(' → '),
                            Object.keys(s.BySource).map(function (k) { return (STRINGS[LANG]['source' + k] ? t('source' + k) : k) + ' ' + s.BySource[k]; }).join(', '))) + '</p>'
                        + s.Notes.map(function (n) { return '<p class="fieldDescription">⚠ ' + esc(n) + '</p>'; }).join('')
                        + '<details open><summary>' + esc(t('proposed', s.ProposedArtists.length)) + '</summary><div class="tml-chips">'
                        + s.ProposedArtists.map(function (a) { return '<span title="' + esc(t('albumsCount', a.Albums)) + '">' + esc(a.Name) + '</span>'; }).join('') + '</div></details>'
                        + '<details><summary>' + esc(t('leaving', hidden.length, merged.length, deleted.length)) + '</summary>'
                        + '<p>' + esc(t('guests')) + '</p><div class="tml-chips">' + hidden.map(function (r) { return chip(r, r.Name); }).join('') + '</div>'
                        + '<p>' + esc(t('merged')) + '</p><div class="tml-chips">' + merged.map(function (r) { return chip(r, r.Name + ' → ' + r.Into); }).join('') + '</div>'
                        + '<p>' + esc(t('stray')) + '</p><div class="tml-chips">' + deleted.map(function (r) { return chip(r, r.Name); }).join('') + '</div></details>'
                        + '<details><summary>' + esc(t('renamed', s.Renames.length)) + '</summary><div class="tml-chips">'
                        + s.Renames.map(function (r) { return '<span>' + esc(r.From) + ' → ' + esc(r.To) + '</span>'; }).join('') + '</div></details>'
                        + '<div class="tml-filters">' + FILTERS.map(function (f) {
                            return '<button is="emby-button" type="button" class="emby-button ' + (filter === f ? 'tml-on' : '') + '" data-filter="' + f + '">' + esc(filterLabel(f)) + '</button>';
                        }).join('') + '</div>';

                    var rows = lib.Albums.filter(matches).map(function (a, i) {
                        var id = 'tml-' + index + '-' + i;
                        var badges = flags(a.Flags).map(function (f) { return '<span class="tml-flag tml-flag-' + f + '">' + esc(t('flag' + f)) + '</span>'; }).join('');
                        var current = (a.CurrentAlbumArtists || []).join(', ');
                        return '<tr class="tml-album" data-target="' + id + '"><td>' + esc(a.Path) + '<br><small>' + esc(a.ReleaseType || '') + '</small></td>'
                            + '<td>' + (a.Changed ? '<span class="tml-old">' + esc(current) + '</span>' : '<span class="tml-same">' + esc(current) + '</span>') + '</td>'
                            + '<td><b>' + esc(names(a.MainArtists)) + '</b></td>'
                            + '<td>' + esc(sourceLabel(a)) + '<br><small>' + esc(t('conf' + a.Confidence)) + '</small></td>'
                            + '<td>' + badges + '<br><small>' + esc((a.Notes || []).join(' · ')) + '</small></td></tr>'
                            + '<tr class="tml-tracks" id="' + id + '" style="display:none"><td colspan="5">' + renderTracks(a) + '</td></tr>';
                    }).join('');
                    html += '<table class="tml-table"><thead><tr><th>' + esc(t('colAlbum')) + '</th><th>' + esc(t('colCurrent')) + '</th><th>' + esc(t('colProposed')) + '</th><th>' + esc(t('colSource')) + '</th><th>' + esc(t('colNotes')) + '</th></tr></thead><tbody>'
                        + (rows || '<tr><td colspan="5">' + esc(t('noAlbums')) + '</td></tr>') + '</tbody></table>';
                    return html;
                }

                function renderReport() {
                    var el = page.querySelector('#tmlReport');
                    if (!report) { el.innerHTML = '<p class="fieldDescription">' + esc(t('noAnalysis')) + '</p>'; return; }
                    var mb = report.MusicBrainz || {};
                    el.innerHTML = '<p class="fieldDescription">' + esc(t('analysisOf', date(report.GeneratedAt), mb.Requests || 0, mb.CacheHits || 0, mb.Failures || 0)) + '</p>'
                        + report.Libraries.map(renderLibrary).join('');
                }

                function loadReport() {
                    var getOverrides = ApiClient.fetch({ url: ApiClient.getUrl('TrueMusicLibrary/Overrides'), type: 'GET', dataType: 'json' })
                        .then(function (o) { overrides = o || {}; }, function () { overrides = {}; });
                    var getReport = ApiClient.fetch({ url: ApiClient.getUrl('TrueMusicLibrary/Analysis'), type: 'GET', dataType: 'json' })
                        .then(function (r) { report = r; }, function () { report = null; });
                    return Promise.all([getOverrides, getReport]).then(renderReport);
                }

                // ---------------------------------------------------------------- choix manuels
                function saveOverride(box, remove) {
                    var albumId = box.getAttribute('data-album');
                    var status = box.querySelector('[data-override-status]');
                    var artists = box.querySelector('input').value.split(';').map(function (n) { return n.trim(); }).filter(function (n) { return n; });
                    if (!remove && artists.length === 0) { status.textContent = t('overrideEmpty'); return; }
                    var request = remove
                        ? ApiClient.fetch({ url: ApiClient.getUrl('TrueMusicLibrary/Overrides/' + albumId), type: 'DELETE' })
                        : ApiClient.fetch({ url: ApiClient.getUrl('TrueMusicLibrary/Overrides/' + albumId), type: 'PUT', data: JSON.stringify({ MainArtists: artists }), contentType: 'application/json' });
                    request.then(function () {
                        if (remove) { delete overrides[albumId]; } else { overrides[albumId] = { MainArtists: artists }; }
                        var detail = box.parentNode;
                        var a = null;
                        (report ? report.Libraries : []).forEach(function (l) { l.Albums.forEach(function (x) { if (x.Id === albumId) { a = x; } }); });
                        if (a) { detail.querySelector('.tml-override').outerHTML = renderOverride(a); }
                        detail.querySelector('[data-override-status]').textContent = t(remove ? 'overrideRemoved' : 'overrideSaved');
                    });
                }

                // ---------------------------------------------------------------- tâches
                function isRunning(x) { return x && (x.state === 'Running' || x.state === 'Cancelling'); }

                function taskLabel(k) { return t('task' + k.charAt(0).toUpperCase() + k.slice(1)); }

                function loadLastOperation() {
                    var el = page.querySelector('#tmlLastOperation');
                    ApiClient.fetch({ url: ApiClient.getUrl('TrueMusicLibrary/Operation/Last'), type: 'GET', dataType: 'json' }).then(function (r) {
                        var label = t({ Restore: 'lastRestore', Scan: 'lastScan' }[r.Operation] || 'lastRepair');
                        el.innerHTML = '<p class="fieldDescription">' + esc(label + ' ' + date(r.FinishedAt || r.StartedAt) + ' — '
                            + t('lastSummary', r.AlbumsUpdated, r.TracksUpdated, r.ArtistsRenamed, r.ArtistsCreated, r.ArtistsDeleted)
                            + (r.Skipped ? t('skipped', r.Skipped) : '')
                            + (r.RemainingAlbumChanges != null ? t('remaining', r.RemainingAlbumChanges, r.RemainingTrackChanges) : '')
                            + (r.SnapshotId ? t('snapshot', r.SnapshotId) : '')) + '</p>'
                            + (r.Errors && r.Errors.length ? '<p class="fieldDescription">⚠ ' + esc(t('errors', r.Errors.length, r.Errors.slice(0, 5).join(' ; '))) + '</p>' : '');
                    }).catch(function () { el.innerHTML = ''; });
                }

                function pollStatus() {
                    ApiClient.fetch({ url: ApiClient.getUrl('TrueMusicLibrary/Tasks/Status'), type: 'GET', dataType: 'json' }).then(function (s) {
                        var el = page.querySelector('#tmlAnalysisState');
                        var running = ['analyze', 'repair', 'restore'].filter(function (k) { return isRunning(s[k]); })[0];
                        page.querySelector('#btnAnalyze').disabled = !!running;
                        page.querySelector('#btnRepair').disabled = !!running;
                        page.querySelector('#btnRestore').disabled = !!running || !s.canRestore;
                        if (running) {
                            el.textContent = t('running', taskLabel(running), Math.round(s[running].progress || 0));
                            pollTimer = setTimeout(pollStatus, 2000);
                            return;
                        }

                        var a = s.analyze || {};
                        el.textContent = a.lastStatus ? t('lastAnalysis', t('status' + a.lastStatus)) + (a.lastError ? ' — ' + a.lastError : '') : '';
                        ['repair', 'restore'].forEach(function (k) {
                            if (s[k] && s[k].lastStatus && s[k].lastStatus !== 'Completed' && s[k].lastError) {
                                el.textContent += ' — ' + taskLabel(k) + t('colon') + s[k].lastError;
                            }
                        });
                        if (pollTimer) { pollTimer = null; loadReport(); loadLastOperation(); loadStatus(); }
                    });
                }

                function runTask(path) {
                    ApiClient.fetch({ url: ApiClient.getUrl(path), type: 'POST' }).then(function () {
                        pollTimer = setTimeout(pollStatus, 1000);
                    });
                }

                page.querySelector('#btnAnalyze').addEventListener('click', function () { runTask('TrueMusicLibrary/Analysis/Run'); });

                page.querySelector('#btnRepair').addEventListener('click', function () {
                    var albums = 0, tracks = 0, deleted = 0, renames = 0;
                    (report ? report.Libraries : []).forEach(function (l) {
                        albums += l.Summary.ChangedAlbums; tracks += l.Summary.ChangedTracks; renames += l.Summary.Renames.length;
                        deleted += l.Summary.Removed.filter(function (r) { return r.Fate !== 'Hidden'; }).length;
                    });
                    var message = report ? t('confirmRepair', albums, tracks, renames, deleted) : t('confirmRepairNoReport');
                    if (window.confirm(message)) { runTask('TrueMusicLibrary/Repair/Run'); }
                });

                page.querySelector('#btnRestore').addEventListener('click', function () {
                    if (window.confirm(t('confirmRestore'))) { runTask('TrueMusicLibrary/Restore/Run'); }
                });

                page.querySelector('#tmlReport').addEventListener('click', function (e) {
                    var button = e.target.closest('[data-filter]');
                    if (button) { filter = button.getAttribute('data-filter'); renderReport(); return; }
                    var overrideButton = e.target.closest('[data-override]');
                    if (overrideButton) { saveOverride(overrideButton.closest('.tml-override'), overrideButton.getAttribute('data-override') === 'remove'); return; }
                    var row = e.target.closest('tr.tml-album');
                    if (row) {
                        var detail = page.querySelector('#' + row.getAttribute('data-target'));
                        detail.style.display = detail.style.display === 'none' ? '' : 'none';
                    }
                });

                page.querySelector('#tmlReport').addEventListener('keydown', function (e) {
                    if (e.key === 'Enter' && e.target.matches('.tml-override input')) { e.preventDefault(); saveOverride(e.target.closest('.tml-override'), false); }
                });

                function loadStatus() {
                    var el = page.querySelector('#TrueMusicLibraryStatus');
                    ApiClient.fetch({ url: ApiClient.getUrl('TrueMusicLibrary/Status'), type: 'GET', dataType: 'json' })
                        .then(function (s) {
                            el.textContent = t('version', s.version, s.target);
                            var p = s.persistence || {};
                            page.querySelector('#tmlPersistence').textContent = p.active
                                ? t('persistenceActive', date(p.since), p.albums) + (p.updatedAt ? t('persistenceUpdated', date(p.updatedAt)) : '')
                                : (p.since ? t('persistenceOff') : t('persistenceInactive'));
                        })
                        .catch(function () { el.textContent = ''; });
                }

                page.addEventListener('pageshow', function () {
                    translatePage();
                    Dashboard.showLoadingMsg();
                    ApiClient.getPluginConfiguration(pluginId).then(function (config) {
                        page.querySelector('#selCollaboration').value = config.Collaboration || 'Both';
                        page.querySelector('#selCompilation').value = config.Compilation || 'FolderArtist';
                        page.querySelector('#selDisplayName').value = config.DisplayName || 'MusicBrainz';
                        page.querySelector('#txtVariousArtists').value = config.VariousArtistsName || '';
                        page.querySelector('#txtGuestJoins').value = config.GuestJoinPhrases || '';
                        page.querySelector('#txtWhitelist').value = config.NameWhitelist || '';
                        page.querySelector('#chkRewrite').checked = config.EnableArtistsRouteRewrite !== false;
                        page.querySelector('#chkPersistence').checked = config.EnablePersistence !== false;
                        page.querySelector('#chkHideGuests').checked = config.HideGuestArtists !== false;
                        page.querySelector('#chkHideTab').checked = config.HideAlbumArtistsTab !== false;
                        Dashboard.hideLoadingMsg();
                        loadStatus();
                        loadReport();
                        loadLastOperation();
                        pollStatus();
                    });
                });

                page.querySelector('#TrueMusicLibraryConfigForm').addEventListener('submit', function (e) {
                    e.preventDefault();
                    Dashboard.showLoadingMsg();
                    ApiClient.getPluginConfiguration(pluginId).then(function (config) {
                        config.Collaboration = page.querySelector('#selCollaboration').value;
                        config.Compilation = page.querySelector('#selCompilation').value;
                        config.DisplayName = page.querySelector('#selDisplayName').value;
                        config.VariousArtistsName = page.querySelector('#txtVariousArtists').value;
                        config.GuestJoinPhrases = page.querySelector('#txtGuestJoins').value;
                        config.NameWhitelist = page.querySelector('#txtWhitelist').value;
                        config.EnableArtistsRouteRewrite = page.querySelector('#chkRewrite').checked;
                        config.EnablePersistence = page.querySelector('#chkPersistence').checked;
                        config.HideGuestArtists = page.querySelector('#chkHideGuests').checked;
                        config.HideAlbumArtistsTab = page.querySelector('#chkHideTab').checked;
                        ApiClient.updatePluginConfiguration(pluginId, config).then(function (result) {
                            Dashboard.processPluginConfigurationUpdateResult(result);
                            loadStatus();
                        });
                    });
                    return false;
                });
            })();
        </script>
    </div>
</body>
</html>
